# Contributors: Claude (split the jobs, added docs-only detection and the CI summary job, #67;
# Firebase emulators for the rules and emulator tests, #159; parallel checks, unit test,
# instrumented test and SonarCloud jobs, system image download retries, and the APK install and
# broadcast wait before the device tests, #192).

# Contributors: OpenAI Codex (publish the main APK after the parallel CI jobs, #137).
# OpenAI Codex (temporary workaround for the instrumented-test launch hang in PR #259).

name: CI - Test Runner

# Run the workflow when commits are pushed on main or when a PR is modified
on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# A new push to a PR cancels that PR's previous run. Runs on main get a unique group (their run id),
# so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# The jobs only read the repository. A job that needs more asks for it itself.
permissions:
  contents: read

# The jobs run in parallel where they can: "Checks", "Build and unit tests", "Instrumented tests"
# and "Release build" start together, and "Coverage and SonarCloud" starts once the first three
# are done. "Instrumented tests" is the longest, so it sets the duration of a run.
jobs:
  # A PR that only changes documentation (docs/ and Markdown outside app/) cannot break the build,
  # so the build and test jobs skip it. Pushes on main always run everything.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      docs-only: ${{ steps.filter.outputs.docs-only }}

    steps:
      - name: Check whether only documentation changed
        id: filter
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # A renamed file is listed under its new name only, so add its old name too
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          # Markdown in app/ is not documentation: it can be a packaged resource.
          # Each grep succeeds if it finds a file that is not documentation.
          if grep -qvE '\.md$|^docs/' <<< "$files" || grep -qE '^app/.*\.md$' <<< "$files"; then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
          else
            echo "Only documentation changed, so the build and test jobs are skipped."
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
          fi

  # Formatting, lint and the Security Rules tests don't depend on the tests, so they run in their
  # own job instead of adding about 2 minutes to the others.
  checks:
    name: Checks
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Decode secrets
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: bash .github/scripts/decode-secrets.sh

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      # Caching is a very useful part of a CI, as a workflow is executed in a clean environment every time,
      # this means that one would need to re-download and re-process gradle files for every run. Which is very time consuming.
      #
      # To avoid that, we cache the the gradle folder to reuse it later.
      # v3 no longer works with GitHub's cache service. v6+ moves caching into a proprietary
      # component with separate terms of use, so stay on v5 unless the team accepts them.
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5

      # One Gradle run for both. --continue runs lint even when ktfmt fails, so a PR sees both.
      - name: Formatting (ktfmt) and lint
        run: |
          ./gradlew ktfmtCheck lint --continue

      # For the "Coverage and SonarCloud" job, which imports the lint issues
      - name: Upload lint results
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.xml
          retention-days: 1
          if-no-files-found: error

      # The rules tests need the Firestore emulator, started with the Firebase CLI
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      # Pinned, so a new CLI release can't change CI without a PR
      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools@15.33.0

      - name: Security Rules tests
        run: |
          npm ci --prefix firebase
          firebase emulators:exec --project demo-polysocial --only firestore "node firebase/firestore/firestore.rules.test.js"

      # Lint reports, to debug a failed run. Download them from the run's summary page.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: checks-reports
          path: app/build/reports/
          retention-days: 7
          if-no-files-found: ignore

  # This job only builds the debug variant, which the tests and Sonar use. The release variant is
  # built by the "Release build" job.
  build-and-test:
    name: Build and unit tests
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Decode secrets
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: bash .github/scripts/decode-secrets.sh

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      # See "Gradle cache" in the "Checks" job
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5

      # One Gradle run, so the unit tests reuse the build's configuration and daemon.
      # Not check: the rest of check (ktfmt and lint) runs in the "Checks" job.
      - name: Build debug app and unit tests
        run: |
          # To run the CI with debug information, add --info
          ./gradlew assembleDebug testDebugUnitTest

      # For the "Coverage and SonarCloud" job: the unit test coverage and results, and the classes
      # that jacocoTestReport reads (after Hilt's bytecode rewrite). They come from the same build
      # as the coverage data, so JaCoCo matches them.
      - name: Upload unit test coverage
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage
          path: |
            app/build/outputs/unit_test_code_coverage/debugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/intermediates/classes/debug/transformDebugClassesWithAsm/dirs/
          retention-days: 1
          if-no-files-found: error

      # Hand this job's debug APK to the final CI job. Device-test shards build their own APKs
      # from the same commit. Coaches use polysocial-apk after all checks.
      - name: Preserve main debug APK for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: ci-main-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
          if-no-files-found: error

      # Unit test reports, to debug a failed run. Download them from the run's summary page.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/
          retention-days: 7
          if-no-files-found: ignore

  # The instrumented tests, including the @EmulatorTest tests, run on an Android emulator next to
  # the Firebase emulators. They take the longest, so they don't wait for the other checks, and
  # they are split into two shards on two runners: each runs half of the tests (AndroidJUnitRunner's
  # numShards and shardIndex), so every test still runs exactly once.
  instrumented-tests:
    name: Instrumented tests (shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    # A run takes about 5 minutes. The limit stops a stuck emulator from running for 6 hours.
    timeout-minutes: 30
    strategy:
      # A failing shard doesn't cancel the other, so a run shows every failing test
      fail-fast: false
      matrix:
        shard: [0, 1]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Decode secrets
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: bash .github/scripts/decode-secrets.sh

      # Kernel-based Virtual Machine (KVM) is an open source virtualization technology built into Linux. Enabling it allows the Android emulator to run faster.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      # See "Gradle cache" in the "Checks" job
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5

      # The @EmulatorTest instrumented tests need the Firebase emulators (Auth and Firestore),
      # started with the Firebase CLI. The Android emulator reaches them at 10.0.2.2.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      # Pinned, so a new CLI release can't change CI without a PR
      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools@15.33.0

      # The next step installs this system image too, but about 1 run in 50 its download arrives
      # corrupted ("Error on ZipFile unknown archive") and the job fails before the emulator starts.
      # Installing it here first, with retries, lets that step find it installed. Keep it in line with
      # the next step's api-level, target and arch.
      - name: Install the emulator system image
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          for attempt in 1 2 3; do
            if "$sdkmanager" --install 'system-images;android-34;google_apis;x86_64' --channel=0 > /dev/null; then
              exit 0
            fi
            echo "::warning::The system image download failed (attempt $attempt of 3)."
            # sdkmanager's partial downloads, so the next attempt starts again from scratch
            rm -rf "$ANDROID_HOME/.temp" "$ANDROID_HOME/.downloadIntermediates"
            sleep 10
          done
          exit 1

      # The emulator boots from scratch (~30 s). A cached snapshot is rejected as soon as the
      # runner installs a newer emulator, and restoring the 1.9 GB cache took as long as a cold boot.
      - name: Instrumented tests (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # TEMPORARY WORKAROUND for PR #259: the background APK build sometimes never writes its
          # status file, leaving both shards waiting before the emulator launches. This cannot be
          # be merged yet: workflow changes require team approval. The PR's original build failure
          # was a missing Hilt binding in an Android test and is fixed in the test sources; keep
          # this slower path until CI confirms the background optimization is safe again.
          # The install waits until the emulator has delivered the broadcasts for that install and
          # its startup: when Android handles a newly added app late, during the first test, it
          # restarts the app's activity, which then has no Compose content ("No compose hierarchies
          # found"). connectedCheck then installs the same APKs again as an update, which Android
          # doesn't handle as a new app. -Pemulator=all runs the @EmulatorTest tests together with
          # the others, in one run, so the coverage report gets them all. The Firebase emulators
          # stop when the run ends.
          script: |
            ./gradlew installDebug installDebugAndroidTest -Pemulator=all -Pandroid.testInstrumentationRunnerArguments.numShards=2 -Pandroid.testInstrumentationRunnerArguments.shardIndex=${{ matrix.shard }}
            timeout 180 "$ANDROID_HOME/platform-tools/adb" shell am wait-for-broadcast-idle || echo "::warning::The emulator's broadcasts were still not idle after 180 s."
            firebase emulators:exec --project demo-polysocial --only firestore,auth "./gradlew connectedCheck -Pemulator=all -Pandroid.testInstrumentationRunnerArguments.numShards=2 -Pandroid.testInstrumentationRunnerArguments.shardIndex=${{ matrix.shard }}"

      # For the "Coverage and SonarCloud" job
      - name: Upload instrumented test coverage
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-coverage-${{ matrix.shard }}
          path: app/build/outputs/code_coverage/debugAndroidTest/connected/
          retention-days: 1
          if-no-files-found: error

      # Instrumented test reports (with the emulator's logcat) and the APK build's log, to debug a
      # failed run. Download them from the run's summary page.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports-${{ matrix.shard }}
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: ignore

  # Merges the unit and instrumented test coverage and sends it to SonarCloud, with the unit test
  # results and the lint issues. It uses the files the other jobs uploaded, so no test runs twice.
  sonar:
    name: Coverage and SonarCloud
    needs: [changes, checks, build-and-test, instrumented-tests]
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of Sonar analysis

      - name: Decode secrets
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: bash .github/scripts/decode-secrets.sh

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      # See "Gradle cache" in the "Checks" job
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5

      # Each artifact goes back to the path it was uploaded from, where jacocoTestReport and Sonar
      # read it (see app/build.gradle.kts). Each shard's coverage goes in its own folder.
      - name: Download unit test coverage
        uses: actions/download-artifact@v8
        with:
          name: unit-test-coverage
          path: app/build/

      - name: Download instrumented test coverage
        uses: actions/download-artifact@v8
        with:
          pattern: instrumented-test-coverage-*
          path: app/build/outputs/code_coverage/debugAndroidTest/connected/

      - name: Download lint results
        uses: actions/download-artifact@v8
        with:
          name: lint-results
          path: app/build/reports/

      # Merges the unit and instrumented test coverage for Sonar. jacocoTestReport doesn't depend on
      # the test tasks (it only runs after them when both are requested), so it reads the downloaded
      # files without running any test.
      - name: Coverage report
        run: |
          ./gradlew jacocoTestReport

      # Sonar compiles the debug classes again (from the Gradle cache when the code didn't change):
      # it reads their classpath, not the downloaded classes.
      - name: SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar

      # The coverage report, to debug a failed run. Download it from the run's summary page.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sonar-reports
          path: app/build/reports/
          retention-days: 7
          if-no-files-found: ignore

  # The release build (R8 shrinking) feeds neither the tests nor Sonar, so it runs in parallel with
  # the other jobs instead of adding roughly 50 seconds to one of them.
  release-build:
    name: Release build
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Decode secrets
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: bash .github/scripts/decode-secrets.sh

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      # See "Gradle cache" in the "Checks" job
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Build release app
        run: |
          ./gradlew assembleRelease

  # The main ruleset requires a single status check named "CI". This job reports the result of the
  # jobs above, so jobs can be added or split without changing the ruleset.
  ci:
    name: CI
    needs: [changes, checks, build-and-test, instrumented-tests, sonar, release-build]
    # Run even when a job failed or was cancelled. If this job were skipped instead, GitHub would
    # count the required check as passed.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check job results
        env:
          DETECT_CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
          CHECKS: ${{ needs.checks.result }}
          BUILD_AND_TEST: ${{ needs.build-and-test.result }}
          INSTRUMENTED_TESTS: ${{ needs.instrumented-tests.result }}
          SONAR: ${{ needs.sonar.result }}
          RELEASE_BUILD: ${{ needs.release-build.result }}
        run: |
          echo "Detect changes: $DETECT_CHANGES"
          echo "Checks: $CHECKS"
          echo "Build and unit tests: $BUILD_AND_TEST"
          echo "Instrumented tests: $INSTRUMENTED_TESTS"
          echo "Coverage and SonarCloud: $SONAR"
          echo "Release build: $RELEASE_BUILD"
          # If detection failed, the build jobs were skipped without checking anything
          if [ "$DETECT_CHANGES" != success ]; then
            echo "::error::Could not detect which files changed."
            exit 1
          fi
          if [ "$DOCS_ONLY" = true ]; then
            echo "Documentation-only change: nothing to build or test."
            exit 0
          fi
          for result in "$CHECKS" "$BUILD_AND_TEST" "$INSTRUMENTED_TESTS" "$SONAR" "$RELEASE_BUILD"; do
            if [ "$result" != success ]; then
              echo "::error::A build, test or analysis job did not succeed (see the results above)."
              exit 1
            fi
          done

      # The result check above must succeed before the coaches' artifact is published.
      - name: Download main debug APK from the tested commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v8
        with:
          name: ci-main-debug-apk
          path: app/build/outputs/apk/debug/

      - name: Upload installable APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: polysocial-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
