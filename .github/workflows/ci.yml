name: CI - Test Runner

# Run the workflow when commits are pushed on main or when a PR is modified
on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# A new push to a PR cancels that PR's previous run. Runs on main get a unique group (their run id),
# so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of Sonar analysis

      - name: Decode secrets
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: bash .github/scripts/decode-secrets.sh

      # Kernel-based Virtual Machine (KVM) is an open source virtualization technology built into Linux. Enabling it allows the Android emulator to run faster.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      # Caching is a very useful part of a CI, as a workflow is executed in a clean environment every time,
      # this means that one would need to re-download and re-process gradle files for every run. Which is very time consuming.
      #
      # To avoid that, we cache the the gradle folder to reuse it later.
      # v3 no longer works with GitHub's cache service. v6+ moves caching into a proprietary
      # component with separate terms of use, so stay on v5 unless the team accepts them.
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Check formatting (ktfmt)
        run: |
          ./gradlew ktfmtCheck

      # This job only builds the debug variant, which the tests and Sonar use. The release variant
      # is built by the "Release build" job.
      - name: Build debug app
        run: |
          # To run the CI with debug information, add --info
          ./gradlew assembleDebug --parallel --build-cache

      - name: Lint
        run: |
          ./gradlew lint --parallel --build-cache

      # Not check: the rest of check (ktfmt and lint) already has its own step
      - name: Unit tests
        run: |
          ./gradlew testDebugUnitTest --parallel --build-cache

      # The emulator boots from scratch (~30 s). A cached snapshot is rejected as soon as the
      # runner installs a newer emulator, and restoring the 1.9 GB cache took as long as a cold boot.
      - name: Instrumented tests (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedCheck --parallel --build-cache

      # Merges the unit and instrumented test coverage for Sonar
      - name: Coverage report
        run: |
          ./gradlew jacocoTestReport

      - name: SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --parallel --build-cache

  # The release build (R8 shrinking) feeds neither the tests nor Sonar, so it runs in parallel with
  # "Build and test" instead of adding roughly 50 seconds to it.
  release-build:
    name: Release build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Decode secrets
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: bash .github/scripts/decode-secrets.sh

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      # See "Gradle cache" in the "Build and test" job
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Build release app
        run: |
          ./gradlew assembleRelease --parallel --build-cache

  # The main ruleset requires a single status check named "CI". This job reports the result of the
  # jobs above, so jobs can be added or split without changing the ruleset.
  ci:
    name: CI
    needs: [build-and-test, release-build]
    # Run even when a job failed or was cancelled. If this job were skipped instead, GitHub would
    # count the required check as passed.
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check job results
        env:
          BUILD_AND_TEST: ${{ needs.build-and-test.result }}
          RELEASE_BUILD: ${{ needs.release-build.result }}
        run: |
          echo "Build and test: $BUILD_AND_TEST"
          echo "Release build: $RELEASE_BUILD"
          if [ "$BUILD_AND_TEST" != success ] || [ "$RELEASE_BUILD" != success ]; then
            echo "::error::Build and test or Release build did not succeed."
            exit 1
          fi
