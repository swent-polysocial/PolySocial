# Contributors: Claude (split the jobs, added docs-only detection and the CI summary job, #67).

name: CI - Test Runner

# Run the workflow when commits are pushed on main or when a PR is modified
on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# A new push to a PR cancels that PR's previous run. Runs on main get a unique group (their run id),
# so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# The jobs only read the repository. A job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  # A PR that only changes documentation (Markdown files and docs/) cannot break the build, so the
  # build and test jobs skip it. Pushes on main always run everything.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      docs-only: ${{ steps.filter.outputs.docs-only }}

    steps:
      - name: Check whether only documentation changed
        id: filter
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
          # grep -v succeeds if at least one file is neither Markdown nor in docs/
          if grep -qvE '\.md$|^docs/' <<< "$files"; then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
          else
            echo "Only documentation changed, so the build and test jobs are skipped."
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    # A cold run takes about 9 minutes. The limit stops a stuck emulator from running for 6 hours.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of Sonar analysis

      - name: Decode secrets
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: bash .github/scripts/decode-secrets.sh

      # Kernel-based Virtual Machine (KVM) is an open source virtualization technology built into Linux. Enabling it allows the Android emulator to run faster.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      # Caching is a very useful part of a CI, as a workflow is executed in a clean environment every time,
      # this means that one would need to re-download and re-process gradle files for every run. Which is very time consuming.
      #
      # To avoid that, we cache the the gradle folder to reuse it later.
      # v3 no longer works with GitHub's cache service. v6+ moves caching into a proprietary
      # component with separate terms of use, so stay on v5 unless the team accepts them.
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Check formatting (ktfmt)
        run: |
          ./gradlew ktfmtCheck

      # This job only builds the debug variant, which the tests and Sonar use. The release variant
      # is built by the "Release build" job.
      - name: Build debug app
        run: |
          # To run the CI with debug information, add --info
          ./gradlew assembleDebug --parallel --build-cache

      - name: Lint
        run: |
          ./gradlew lint --parallel --build-cache

      # Not check: the rest of check (ktfmt and lint) already has its own step
      - name: Unit tests
        run: |
          ./gradlew testDebugUnitTest --parallel --build-cache

      # The emulator boots from scratch (~30 s). A cached snapshot is rejected as soon as the
      # runner installs a newer emulator, and restoring the 1.9 GB cache took as long as a cold boot.
      - name: Instrumented tests (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedCheck --parallel --build-cache

      # Merges the unit and instrumented test coverage for Sonar
      - name: Coverage report
        run: |
          ./gradlew jacocoTestReport

      - name: SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --parallel --build-cache

      # Lint, unit test and instrumented test reports (with the emulator's logcat), to debug a failed
      # run. Download them from the run's summary page.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: ignore

  # The release build (R8 shrinking) feeds neither the tests nor Sonar, so it runs in parallel with
  # "Build and test" instead of adding roughly 50 seconds to it.
  release-build:
    name: Release build
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Decode secrets
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: bash .github/scripts/decode-secrets.sh

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      # See "Gradle cache" in the "Build and test" job
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Build release app
        run: |
          ./gradlew assembleRelease --parallel --build-cache

  # The main ruleset requires a single status check named "CI". This job reports the result of the
  # jobs above, so jobs can be added or split without changing the ruleset.
  ci:
    name: CI
    needs: [changes, build-and-test, release-build]
    # Run even when a job failed or was cancelled. If this job were skipped instead, GitHub would
    # count the required check as passed.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check job results
        env:
          DETECT_CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
          BUILD_AND_TEST: ${{ needs.build-and-test.result }}
          RELEASE_BUILD: ${{ needs.release-build.result }}
        run: |
          echo "Detect changes: $DETECT_CHANGES"
          echo "Build and test: $BUILD_AND_TEST"
          echo "Release build: $RELEASE_BUILD"
          # If detection failed, the build jobs were skipped without checking anything
          if [ "$DETECT_CHANGES" != success ]; then
            echo "::error::Could not detect which files changed."
            exit 1
          fi
          if [ "$DOCS_ONLY" = true ]; then
            echo "Documentation-only change: nothing to build or test."
            exit 0
          fi
          if [ "$BUILD_AND_TEST" != success ] || [ "$RELEASE_BUILD" != success ]; then
            echo "::error::Build and test or Release build did not succeed."
            exit 1
          fi
